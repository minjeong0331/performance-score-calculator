<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>성과평가 점수 계산기</title>
<style>
:root{
  --bg:#f5f7fb; --card:#fff; --ink:#172033; --muted:#6d778a; --line:#e3e8f1;
  --primary:#3157d5; --primary-soft:#eef2ff; --shadow:0 10px 28px rgba(31,44,77,.07);
}
*{box-sizing:border-box}
body{margin:0;font-family:Pretendard,"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
.wrap{max-width:1180px;margin:0 auto;padding:42px 20px 72px}
.header{margin-bottom:24px}.header h1{font-size:32px;margin:0 0 8px;letter-spacing:-.04em}.header p{margin:0;color:var(--muted);line-height:1.6}
.summary{background:linear-gradient(135deg,#3157d5,#5275eb);color:#fff;border-radius:22px;padding:24px 28px;margin-bottom:22px;display:flex;align-items:center;justify-content:space-between;gap:20px;box-shadow:var(--shadow)}
.summary-label{font-size:14px;opacity:.85}.summary-score{font-size:40px;font-weight:800;letter-spacing:-.04em}.summary-score span{font-size:18px;font-weight:600}.summary-note{font-size:13px;opacity:.82;text-align:right;line-height:1.5}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;min-height:430px}
.card-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:16px}.num{min-width:34px;height:34px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-weight:800;display:flex;align-items:center;justify-content:center}
.head-main{flex:1;min-width:0}.indicator-name{width:100%;border:0;border-bottom:1px dashed #ccd4e2;border-radius:0;height:32px;padding:0 2px;font-size:17px;font-weight:800;background:transparent}.indicator-name:focus{box-shadow:none;border-color:var(--primary)}
.method-row{margin-bottom:16px}.label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:7px}
select,input{width:100%;height:44px;border:1px solid #d8deea;border-radius:11px;background:#fff;padding:0 12px;font-size:15px;color:var(--ink);outline:none;transition:.15s;font-variant-numeric:tabular-nums}
select:focus,input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(49,87,213,.10)}
.method-desc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{min-width:0}.full{grid-column:1/-1}.hint{font-size:11px;color:#9aa3b2;font-weight:500}.calc-value{height:44px;border:1px solid #d8deea;border-radius:11px;background:#f8f9fc;padding:0 12px;display:flex;align-items:center;font-size:15px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums}
.result{margin-top:18px;border-top:1px solid var(--line);padding-top:16px;display:grid;grid-template-columns:1fr auto;gap:7px 18px;align-items:center}.result .k{font-size:13px;color:var(--muted)}.result .v{font-size:13px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.result .final-k{font-weight:800;color:var(--ink);font-size:14px;margin-top:5px}.result .final-v{font-weight:900;color:var(--primary);font-size:24px;margin-top:5px;letter-spacing:-.03em}
.formula{margin-top:12px;background:#f8f9fc;border-radius:11px;padding:10px 12px;color:var(--muted);font-size:12px;line-height:1.55}
.footer{color:#8992a3;font-size:12px;text-align:center;margin-top:22px}
@media(max-width:850px){.cards{grid-template-columns:1fr}.summary{align-items:flex-start;flex-direction:column}.summary-note{text-align:left}}
@media(max-width:560px){.wrap{padding:26px 12px 48px}.header h1{font-size:27px}.card{padding:17px}.grid,.grid.three{grid-template-columns:1fr}.summary-score{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>성과평가 점수 계산기</h1>
    <p>각 평가항목에서 평가방법을 선택하면 필요한 입력칸이 자동으로 바뀌고, 평가점수와 최종 반영점수가 계산됩니다.</p>
  </div>

  <div class="summary">
    <div>
      <div class="summary-label">최종 반영점수 합계</div>
      <div class="summary-score" id="grandTotal">0<span>점</span></div>
    </div>
    <div class="summary-note">입력이 완료된 카드만 합산합니다.<br>각 카드의 반영비율(%)이 적용됩니다.</div>
  </div>

  <div class="cards" id="cards"></div>
  <div class="footer">※ 업로드된 「정량평가 계산식(양식)」의 산식을 기준으로 구현</div>
</div>
<script>
const METHODS = {
  up: {
    name:'목표대비 상향평가',
    desc:'최근 3개년 실적 평균에 최고·최저목표 비율을 적용해 목표값을 자동 산출하고, 목표부여 70점 + 달성수준 난이도 30점을 계산합니다. 달성수준 난이도는 최고목표를 기준으로 계산합니다.',
    formula:'최고목표 = 최근 3개년 평균 × 최고목표 비율, 최저목표 = 최근 3개년 평균 × 최저목표 비율. 목표부여 점수 = (올해실적 - 최저목표) ÷ (최고목표 - 최저목표) × 70점(최대 70점). 달성수준 난이도는 올해실적이 최고목표의 115% 이상이면 30점, 110% 이상 28.5점, 107.5% 이상 27점, 105% 이상 25.5점, 101% 이상 24점, 그 미만 22.5점으로 산정합니다.'
  },
  target: {
    name:'목표대비 실적평가',
    desc:'목표 달성률의 구간점수 70% + 달성수준 난이도 30점을 합산합니다.',
    formula:'전년도 실적은 참고용 입력값이며 점수 산식에는 영향을 주지 않습니다. 목표 달성률을 구간점수로 환산한 뒤 70%를 적용하고 난이도 점수 30점을 더합니다.'
  },
  sat: {
    name:'만족도 평가',
    desc:'전년도 실적이 있는 경우 올해 만족도와 전년 대비 개선점수를 함께 반영합니다.',
    formula:'올해 만족도 + 전년 대비 개선율 점수로 계산하며, 개선점수는 최대 10점까지 반영됩니다.'
  },
  satNew: {
    name:'만족도 평가 (신규)',
    desc:'전년도 실적이 없는 신규 지표는 올해 만족도 실적을 그대로 평가점수로 적용합니다.',
    formula:'신규 지표는 전년 대비 개선점수 없이 올해 실적을 직접 적용합니다.'
  }
};

const state = [
  {method:'up', score:NaN},
  {method:'target', score:NaN},
  {method:'sat', score:NaN},
  {method:'satNew', score:NaN}
];

const fmt=(v)=>Number.isFinite(v)
  ? Number(v).toLocaleString('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2})
  : '-';
const fmtTarget=(v)=>Number.isFinite(v)
  ? Math.round(Number(v)).toLocaleString('ko-KR',{maximumFractionDigits:0})
  : '-';
const input=(label,key,placeholder='',value='',extra='')=>`<div class="field ${extra}"><div class="label">${label}</div><input data-key="${key}" type="number" step="any" placeholder="${placeholder}" ${value!==''?`value="${value}"`:''}></div>`;
const calcBox=(label,key)=>`<div class="field"><div class="label">${label}</div><div class="calc-value" data-calc="${key}">-</div></div>`;

function difficulty(actual, base, weight=30){
  let s=75;
  if(actual>=base*1.15)s=100;
  else if(actual>=base*1.10)s=95;
  else if(actual>=base*1.075)s=90;
  else if(actual>=base*1.05)s=85;
  else if(actual>=base*1.01)s=80;
  return s/100*weight;
}

function methodOptions(selected){
  return Object.entries(METHODS).map(([key,m])=>`<option value="${key}" ${key===selected?'selected':''}>${m.name}</option>`).join('');
}

function fieldsHtml(method){
  if(method==='up') return `<div class="grid">
    ${input('3년 전 실적','y1','예: 3990')}
    ${input('2년 전 실적','y2','예: 5260')}
    ${input('전년도 실적','y3','예: 7463')}
    ${input('올해 실적','now','올해 실적')}
    ${input('최고목표 비율 (%)','highRate','예: 130')}
    ${calcBox('최고목표 자동계산','highAuto')}
    ${input('최저목표 비율 (%)','lowRate','예: 80')}
    ${calcBox('최저목표 자동계산','lowAuto')}
    ${input('반영비율 (%)','weight','',100,'full')}
  </div>`;
  if(method==='target') return `<div class="grid">
    ${input('전년도 실적 <span class="hint">(참고)</span>','prev','예: 88')}
    ${input('목표값','goal','예: 91')}
    ${input('올해 실적','now','예: 100')}
    ${input('반영비율 (%)','weight','',100)}
  </div>`;
  if(method==='sat') return `<div class="grid">
    ${input('전년도 실적','prev','예: 76.42')}
    ${input('올해 실적','now','예: 80')}
    ${input('반영비율 (%)','weight','',100,'full')}
  </div>`;
  return `<div class="grid">
    ${input('올해 실적','now','예: 98.33')}
    ${input('반영비율 (%)','weight','',100)}
  </div>`;
}

function resultHtml(method){
  if(method==='up') return rows([
    ['3개년 평균(난이도 기준)','base'],['최고목표','highDisplay'],['최저목표','lowDisplay'],['목표부여 점수','p1'],['난이도 점수','p2'],['평가점수','raw'],['최종 반영점수','final',true]
  ]);
  if(method==='target') return rows([
    ['전년도 실적','prevDisplay'],['목표 달성률','rate'],['구간 환산점수 × 70%','p1'],['난이도 점수','p2'],['평가점수','raw'],['최종 반영점수','final',true]
  ]);
  if(method==='sat') return rows([
    ['올해 만족도','p1'],['개선점수','p2'],['평가점수','raw'],['개선점수 산정값','improve'],['최종 반영점수','final',true]
  ]);
  return rows([['올해 만족도','raw'],['평가점수','raw2'],['최종 반영점수','final',true]]);
}

function rows(items){
  return `<div class="result">${items.map(([k,v,final])=>`<div class="${final?'final-k':'k'}">${k}</div><div class="${final?'final-v':'v'}" data-result="${v}">-</div>`).join('')}</div>`;
}

function renderCard(i){
  const s=state[i], m=METHODS[s.method];
  return `<section class="card" data-card="${i}">
    <div class="card-head">
      <div class="num">${i+1}</div>
      <div class="head-main"><input class="indicator-name" type="text" value="평가항목 ${i+1}" aria-label="평가항목명"></div>
    </div>
    <div class="method-row">
      <div class="label">평가방법</div>
      <select class="method-select">${methodOptions(s.method)}</select>
      <div class="method-desc">${m.desc}</div>
    </div>
    <div class="fields">${fieldsHtml(s.method)}</div>
    ${resultHtml(s.method)}
    <div class="formula">${m.formula}</div>
  </section>`;
}

function renderAll(){
  document.getElementById('cards').innerHTML=state.map((_,i)=>renderCard(i)).join('');
  bindEvents();
  updateTotal();
}

function bindEvents(){
  document.querySelectorAll('.card').forEach(card=>{
    const i=Number(card.dataset.card);
    card.querySelector('.method-select').addEventListener('change',e=>{
      state[i].method=e.target.value;
      state[i].score=NaN;
      const currentName=card.querySelector('.indicator-name').value;
      const wrapper=document.createElement('div');
      wrapper.innerHTML=renderCard(i);
      const next=wrapper.firstElementChild;
      next.querySelector('.indicator-name').value=currentName;
      card.replaceWith(next);
      bindSingle(next,i);
      updateTotal();
    });
    bindSingle(card,i);
  });
}

function bindSingle(card,i){
  const select=card.querySelector('.method-select');
  if(!select.dataset.bound){
    select.dataset.bound='1';
    select.addEventListener('change',e=>{
      state[i].method=e.target.value;
      state[i].score=NaN;
      const currentName=card.querySelector('.indicator-name').value;
      const wrapper=document.createElement('div');
      wrapper.innerHTML=renderCard(i);
      const next=wrapper.firstElementChild;
      next.querySelector('.indicator-name').value=currentName;
      card.replaceWith(next);
      bindSingle(next,i);
      updateTotal();
    });
  }
  card.querySelectorAll('input[data-key]').forEach(el=>el.addEventListener('input',()=>calculateCard(card,i)));
  calculateCard(card,i);
}

function val(card,key){
  const el=card.querySelector(`[data-key="${key}"]`);
  if(!el || el.value==='') return NaN;
  return Number(el.value);
}
function setR(card,key,value,suffix=''){
  const el=card.querySelector(`[data-result="${key}"]`);
  if(el) el.textContent=Number.isFinite(value)?fmt(value)+suffix:'-';
}
function setTargetR(card,key,value){
  const el=card.querySelector(`[data-result="${key}"]`);
  if(el) el.textContent=Number.isFinite(value)?fmtTarget(value):'-';
}
function setCalc(card,key,value){
  const el=card.querySelector(`[data-calc="${key}"]`);
  if(el) el.textContent=Number.isFinite(value)?fmtTarget(value):'-';
}
function clearResults(card){
  card.querySelectorAll('[data-result]').forEach(el=>el.textContent='-');
  card.querySelectorAll('[data-calc]').forEach(el=>el.textContent='-');
}

function calculateCard(card,i){
  const method=state[i].method;
  if(method==='up'){
    const a=val(card,'y1'),b=val(card,'y2'),c=val(card,'y3'),highRate=val(card,'highRate'),lowRate=val(card,'lowRate'),now=val(card,'now'),w=val(card,'weight');
    if([a,b,c].some(Number.isNaN)){
      clearResults(card); state[i].score=NaN; updateTotal(); return;
    }
    const avg=(a+b+c)/3;
    const high=Number.isFinite(highRate)?avg*highRate/100:NaN;
    const low=Number.isFinite(lowRate)?avg*lowRate/100:NaN;
    setCalc(card,'highAuto',high);
    setCalc(card,'lowAuto',low);
    setR(card,'base',avg);
    setTargetR(card,'highDisplay',high);
    setTargetR(card,'lowDisplay',low);

    if([highRate,lowRate,now,w].some(Number.isNaN) || high===low){
      ['p1','p2','raw','final'].forEach(k=>setR(card,k,NaN));
      state[i].score=NaN; updateTotal(); return;
    }
    const p1=Math.min(((now-low)/(high-low))*70,70);
    const difficultyRate =
      now >= high*1.15 ? 100 :
      now >= high*1.10 ? 95 :
      now >= high*1.075 ? 90 :
      now >= high*1.05 ? 85 :
      now >= high*1.01 ? 80 : 75;
    const p2=Math.round(difficultyRate*100)/100*0.01*30, raw=p1+p2, final=raw*w/100;
    setR(card,'p1',p1,'점');setR(card,'p2',p2,'점');setR(card,'raw',raw,'점');setR(card,'final',final,'점');
    state[i].score=final;
  } else if(method==='target'){
    const prev=val(card,'prev'),goal=val(card,'goal'),now=val(card,'now'),w=val(card,'weight');
    if([goal,now,w].some(Number.isNaN)||goal===0){clearResults(card); if(Number.isFinite(prev))setR(card,'prevDisplay',prev); state[i].score=NaN;updateTotal();return;}
    const measured=now/goal*100;
    let band;
    if(measured<20)band=15; else if(measured<30)band=25; else if(measured<40)band=35; else if(measured<50)band=45; else if(measured<60)band=55; else if(measured<70)band=65; else if(measured<80)band=75; else if(measured<90)band=85; else band=95;
    const p1=band*.7, p2=difficulty(now,goal,30), raw=p1+p2, final=raw*w/100;
    setR(card,'prevDisplay',prev);setR(card,'rate',measured,'%');setR(card,'p1',p1,'점');setR(card,'p2',p2,'점');setR(card,'raw',raw,'점');setR(card,'final',final,'점');
    state[i].score=final;
  } else if(method==='sat'){
    const prev=val(card,'prev'),now=val(card,'now'),w=val(card,'weight');
    if([prev,now,w].some(Number.isNaN)||prev===0){clearResults(card);state[i].score=NaN;updateTotal();return;}
    const improve=(now-prev)/prev*10, p2=Math.min(improve,10), raw=now+p2, final=raw*w/100;
    setR(card,'p1',now,'점');setR(card,'p2',p2,'점');setR(card,'raw',raw,'점');setR(card,'improve',improve,'점');setR(card,'final',final,'점');
    state[i].score=final;
  } else {
    const now=val(card,'now'),w=val(card,'weight');
    if([now,w].some(Number.isNaN)){clearResults(card);state[i].score=NaN;updateTotal();return;}
    const final=now*w/100;
    setR(card,'raw',now,'점');setR(card,'raw2',now,'점');setR(card,'final',final,'점');
    state[i].score=final;
  }
  updateTotal();
}

function updateTotal(){
  const total=state.map(s=>s.score).filter(Number.isFinite).reduce((a,b)=>a+b,0);
  document.getElementById('grandTotal').innerHTML=fmt(total)+'<span>점</span>';
}

renderAll();
</script>
</body>
</html>
